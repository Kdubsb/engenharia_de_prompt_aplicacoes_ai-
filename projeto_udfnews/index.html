<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="UDFNEWS — Portal de informações universitárias com sistema de círculos de interesse por área, semestre, curso e sala.">
<meta name="theme-color" content="#ffffff">
<title>UDFNEWS — Portal Universitário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════
   RESET & BASE
══════════════════════════════════════════════════════ */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --blue:      #0050b3;
  --blue-lt:   #1a5ce5;
  --blue-dk:   #003366;
  --red:       #e51a1a;
  --red-lt:    #ff3a3a;
  --yellow:    #f5c800;
  --green:     #00b341;
  --purple:    #7b2fff;
  --orange:    #ff6b00;
  --cyan:      #00c2e0;
  --pink:      #e5006a;

  --bg:        #ffffff;
  --surface:   #f5f5f5;
  --card:      #fafafa;
  --card2:     #f0f0f0;
  --border:    rgba(0,0,0,0.08);
  --border2:   rgba(0,0,0,0.14);
  --text:      #1a1a1a;
  --muted:     rgba(26,26,26,0.65);
  --faint:     rgba(26,26,26,0.40);

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-xl: 26px;
  --radius-pill: 999px;

  --topbar-h: 56px;
  --footer-h: 34px;
  --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
}


[data-theme="dark"] {
  --bg:        #0f1115;
  --surface:   #171a21;
  --card:      #1d212b;
  --card2:     #252b36;
  --border:    rgba(255,255,255,0.08);
  --border2:   rgba(255,255,255,0.16);
  --text:      #f3f6fb;
  --muted:     rgba(243,246,251,0.72);
  --faint:     rgba(243,246,251,0.45);
}
[data-theme="dark"] header#topbar,
[data-theme="dark"] aside#panel,
[data-theme="dark"] #breadcrumb,
[data-theme="dark"] #legend,
[data-theme="dark"] .login-box,
[data-theme="dark"] .news-chip,
[data-theme="dark"] footer#main-footer {
  background: rgba(23,26,33,0.95);
}
[data-theme="dark"] main#canvas-wrap {
  background: linear-gradient(135deg, #0f1115 0%, #171a21 100%);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

button { cursor: pointer; font-family: inherit; }
a { color: inherit; text-decoration: none; }

:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ══════════════════════════════════════════════════════
   SCROLLBAR
══════════════════════════════════════════════════════ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.28); }

/* ══════════════════════════════════════════════════════
   TOPBAR
══════════════════════════════════════════════════════ */
header#topbar {
  position: fixed;
  inset-block-start: 0;
  inset-inline: 0;
  z-index: 200;
  height: var(--topbar-h);
  background: rgba(255,255,255,0.97);
  border-bottom: 2px solid var(--blue);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-inline: clamp(12px, 3vw, 24px);
  gap: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

/* Logo */
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(22px, 4vw, 30px);
  letter-spacing: 2px;
  line-height: 1;
  white-space: nowrap;
  flex-shrink: 0;
}
.logo .u { color: var(--blue); }
.logo .n { color: var(--red); }
.logo .tagline {
  font-family: 'Nunito', sans-serif;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  display: block;
  margin-top: -2px;
}

/* Nav */
nav#main-nav {
  display: flex;
  gap: 4px;
  flex-wrap: nowrap;
  overflow-x: auto;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
nav#main-nav::-webkit-scrollbar { display: none; }

.tab-btn {
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--muted);
  padding: 5px 14px;
  border-radius: var(--radius-pill);
  font-size: clamp(10px, 1.5vw, 12px);
  font-weight: 800;
  letter-spacing: 0.3px;
  white-space: nowrap;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
}
.tab-btn:hover,
.tab-btn[aria-selected="true"] {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}
.tab-btn.admin-tab { border-color: rgba(229,26,26,0.5); color: var(--red); }
.tab-btn.admin-tab:hover,
.tab-btn.admin-tab[aria-selected="true"] {
  background: var(--red);
  color: #fff;
  border-color: var(--red);
}

/* Zoom controls */
.zoom-controls {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}
.zoom-btn {
  width: 30px; height: 30px;
  background: var(--surface);
  border: 1px solid var(--border2);
  color: var(--text);
  border-radius: var(--radius-sm);
  font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition);
  line-height: 1;
}
.zoom-btn:hover { background: var(--blue); border-color: var(--blue); color: #fff; }
#zoom-val {
  min-width: 40px;
  text-align: center;
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
}

/* Hamburger (mobile) */
.hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  background: transparent;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 7px 8px;
  cursor: pointer;
}
.hamburger span {
  display: block;
  width: 18px; height: 2px;
  background: var(--text);
  border-radius: 2px;
  transition: transform 0.2s, opacity 0.2s;
}

/* ══════════════════════════════════════════════════════
   CANVAS WRAPPER
══════════════════════════════════════════════════════ */
main#canvas-wrap {
  position: fixed;
  inset-block-start: var(--topbar-h);
  inset: var(--topbar-h) 0 var(--footer-h) 0;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
  background: linear-gradient(135deg, #ffffff 0%, #f8f9fa 100%);
}
main#canvas-wrap.grabbing { cursor: grabbing; }

#canvas {
  position: absolute;
  width: 3600px;
  height: 3200px;
  transform-origin: 0 0;
  will-change: transform;
}

/* ══════════════════════════════════════════════════════
   CIRCLES
══════════════════════════════════════════════════════ */
.circle-group {
  position: absolute;
  cursor: pointer;
}
.circle-bg {
  position: absolute;
  border-radius: 50%;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  box-shadow: 0 2px 8px rgba(0,80,179,0.12);
}
.circle-group:hover .circle-bg {
  transform: scale(1.035);
  box-shadow: 0 4px 12px rgba(0,80,179,0.20);
}
.circle-label {
  position: absolute;
  text-align: center;
  font-family: 'Oswald', sans-serif;
  font-weight: 700;
  pointer-events: none;
  text-shadow: 0 1px 3px rgba(255,255,255,0.8);
  line-height: 1.2;
  color: #1a1a1a;
}
.news-chip {
  position: absolute;
  background: rgba(255,255,255,0.95);
  border-radius: 7px;
  padding: 5px 7px;
  font-size: 9px;
  line-height: 1.3;
  color: #1a1a1a;
  pointer-events: none;
  overflow: hidden;
  border: 1px solid rgba(0,0,0,0.10);
  box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  backdrop-filter: blur(4px);
}
.news-chip .nc-tag {
  font-size: 7px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  opacity: 0.75;
  margin-bottom: 2px;
}
.news-chip .nc-title {
  font-weight: 700;
  line-height: 1.25;
  color: #1a1a1a;
}
.news-chip .nc-time {
  font-size: 7px;
  opacity: 0.55;
  margin-top: 2px;
  color: var(--muted);
}

/* ══════════════════════════════════════════════════════
   BREADCRUMB + HINT
══════════════════════════════════════════════════════ */
#breadcrumb {
  position: fixed;
  bottom: calc(var(--footer-h) + 12px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(255,255,255,0.92);
  border: 1px solid var(--border2);
  border-radius: var(--radius-pill);
  padding: 6px 18px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
  backdrop-filter: blur(14px);
  z-index: 90;
  pointer-events: none;
  max-width: 90vw;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  transition: bottom 0.2s;
}
#breadcrumb strong { color: var(--text); }
#breadcrumb .sep { color: var(--faint); }

#hint {
  position: fixed;
  bottom: calc(var(--footer-h) + 52px);
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,80,179,0.08);
  border: 1px solid rgba(0,80,179,0.18);
  border-radius: var(--radius-md);
  padding: 5px 16px;
  font-size: 11px;
  color: var(--blue);
  z-index: 90;
  pointer-events: none;
  transition: opacity 0.8s ease, bottom 0.2s;
  white-space: nowrap;
  font-weight: 600;
}

/* ══════════════════════════════════════════════════════
   SIDE PANEL
══════════════════════════════════════════════════════ */
aside#panel {
  position: fixed;
  inset-block: var(--topbar-h) var(--footer-h);
  inset-inline-end: 0;
  width: min(360px, 100vw);
  background: rgba(255,255,255,0.98);
  border-left: 1px solid var(--border2);
  z-index: 150;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 22px 18px 30px;
  backdrop-filter: blur(20px);
  box-shadow: -2px 0 8px rgba(0,0,0,0.08);
}
aside#panel.open { transform: translateX(0); }

.panel-close {
  position: absolute;
  top: 14px; right: 14px;
  background: transparent;
  border: 1px solid var(--border2);
  color: var(--muted);
  width: 30px; height: 30px;
  border-radius: 50%;
  font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition), color var(--transition);
}
.panel-close:hover { background: var(--red); color: #fff; border-color: var(--red); }

.panel-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 11px;
  border-radius: var(--radius-pill);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 10px;
  background: rgba(0,80,179,0.08);
  color: var(--blue);
}

#panel-title {
  font-family: 'Oswald', sans-serif;
  font-size: clamp(18px,3vw,24px);
  line-height: 1.2;
  margin-bottom: 6px;
  color: var(--text);
}
#panel-desc {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 18px;
  line-height: 1.5;
}

.panel-divider {
  height: 1px;
  background: var(--border);
  margin-bottom: 16px;
}

.panel-news-item {
  background: var(--card);
  border-radius: var(--radius-md);
  padding: 13px 14px;
  margin-bottom: 10px;
  border-left: 3px solid var(--blue);
  transition: background var(--transition), transform 0.15s;
}
.panel-news-item:hover {
  background: var(--card2);
  transform: translateX(2px);
}
.pni-tag {
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.pni-title {
  font-size: 13px;
  font-weight: 800;
  line-height: 1.3;
  margin-bottom: 4px;
  color: var(--text);
}
.pni-body {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
}
.pni-meta {
  font-size: 10px;
  color: var(--faint);
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.empty-state {
  text-align: center;
  padding: 32px 16px;
  color: var(--faint);
  font-size: 13px;
}
.empty-state .es-icon { font-size: 32px; margin-bottom: 10px; }

/* ══════════════════════════════════════════════════════
   MOBILE DRAWER (nav)
══════════════════════════════════════════════════════ */
#mobile-drawer {
  position: fixed;
  inset: 0;
  z-index: 300;
  pointer-events: none;
}
#mobile-drawer.open { pointer-events: all; }
.drawer-scrim {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.4);
  opacity: 0;
  transition: opacity 0.3s;
  backdrop-filter: blur(4px);
}
#mobile-drawer.open .drawer-scrim { opacity: 1; }
.drawer-content {
  position: absolute;
  top: 0; right: 0; bottom: 0;
  width: 260px;
  background: var(--surface);
  border-left: 1px solid var(--border2);
  transform: translateX(100%);
  transition: transform 0.32s cubic-bezier(0.4,0,0.2,1);
  padding: 70px 20px 24px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  box-shadow: -2px 0 8px rgba(0,0,0,0.06);
}
#mobile-drawer.open .drawer-content { transform: translateX(0); }
.drawer-content .tab-btn {
  display: block;
  text-align: left;
  border-radius: var(--radius-md);
  padding: 10px 16px;
  font-size: 14px;
}

/* ══════════════════════════════════════════════════════
   ADMIN PANEL
══════════════════════════════════════════════════════ */
section#admin-panel {
  position: fixed;
  inset: var(--topbar-h) 0 var(--footer-h) 0;
  background: var(--bg);
  z-index: 190;
  display: none;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: clamp(16px, 3vw, 28px);
}
section#admin-panel.open { display: block; }

.admin-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.admin-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(24px, 4vw, 34px);
  letter-spacing: 2px;
  line-height: 1;
  color: var(--text);
}
.admin-title span { color: var(--red); }
.admin-subtitle {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 16px 18px;
  border: 1px solid var(--border);
  box
